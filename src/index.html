<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Baithul Madeena ERP</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anta&family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Instantaneous app boot preloader matching project design system template */
      .bm-boot-splash {
        position: fixed;
        inset: 0;
        background: #0f172a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        font-family:
          'Instrument Sans',
          system-ui,
          -apple-system,
          sans-serif;
        color: #ffffff;
      }
      .bm-boot-logo {
        width: 76px;
        height: 76px;
        border-radius: 20px;
        background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        border: 1px solid rgba(255, 255, 255, 0.12);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow:
          0 20px 40px -10px rgba(0, 0, 0, 0.5),
          0 0 25px rgba(16, 185, 129, 0.25);
        margin-bottom: 24px;
        position: relative;
      }
      .bm-boot-logo-badge {
        position: absolute;
        inset: -2px;
        border-radius: 22px;
        background: linear-gradient(135deg, #10b981 0%, transparent 60%);
        opacity: 0.4;
        z-index: -1;
      }
      .bm-boot-title {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: #ffffff;
        margin: 0 0 6px 0;
      }
      .bm-boot-subtitle {
        font-size: 11px;
        font-weight: 600;
        color: #10b981;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        margin-bottom: 36px;
      }
      .bm-boot-bar-track {
        width: 200px;
        height: 4px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
      }
      .bm-boot-bar-fill {
        position: absolute;
        top: 0;
        left: -50%;
        height: 100%;
        width: 50%;
        background: linear-gradient(90deg, #10b981, #34d399);
        border-radius: 999px;
        box-shadow: 0 0 10px rgba(16, 185, 129, 0.6);
        animation: bmIndeterminate 1.4s infinite ease-in-out;
      }
      @keyframes bmIndeterminate {
        0% {
          left: -40%;
          width: 30%;
        }
        50% {
          left: 30%;
          width: 50%;
        }
        100% {
          left: 100%;
          width: 30%;
        }
      }
    </style>
  </head>
  <body>
    <app-root>
      <div class="bm-boot-splash">
        <div class="bm-boot-logo">
          <div class="bm-boot-logo-badge"></div>
          <svg
            width="38"
            height="38"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#10B981"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 21h18" />
            <path d="M3 10h18" />
            <path d="M5 6l7-3 7 3" />
            <path d="M4 10v11" />
            <path d="M20 10v11" />
            <path d="M8 14v3" />
            <path d="M12 14v3" />
            <path d="M16 14v3" />
          </svg>
        </div>
        <h1 class="bm-boot-title">BAITHUL MADEENA</h1>
        <p class="bm-boot-subtitle">PROPERTY OPERATING SYSTEM</p>
        <div class="bm-boot-bar-track">
          <div class="bm-boot-bar-fill"></div>
        </div>
      </div>
    </app-root>
  </body>
</html>
